<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SynthBank AI Support</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4f8; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }

  .wrapper { width: 100%; max-width: 780px; height: 92vh; display: flex; flex-direction: column; background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); overflow: hidden; }

  header { background: #1a3c6e; color: white; padding: 16px 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  header .avatar { width: 40px; height: 40px; border-radius: 50%; background: #2e5fa3; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  header h1 { font-size: 16px; font-weight: 600; }
  header p { font-size: 12px; opacity: 0.75; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; margin-left: auto; }

  .upload-bar { padding: 10px 16px; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; gap: 10px; background: #f8fafc; flex-shrink: 0; }
  .upload-bar label { font-size: 13px; color: #475569; cursor: pointer; display: flex; align-items: center; gap: 6px; background: white; border: 1px solid #d1d5db; border-radius: 8px; padding: 6px 12px; transition: background 0.15s; }
  .upload-bar label:hover { background: #f1f5f9; }
  #file-input { display: none; }
  #upload-status { font-size: 12px; color: #64748b; }

  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

  .msg { display: flex; gap: 10px; max-width: 80%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.bot { align-self: flex-start; }

  .bubble { padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.6; }
  .user .bubble { background: #1a3c6e; color: white; border-bottom-right-radius: 4px; }
  .bot .bubble { background: #f1f5f9; color: #1e293b; border-bottom-left-radius: 4px; }

  .bot-avatar { width: 32px; height: 32px; border-radius: 50%; background: #1a3c6e; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; margin-top: 2px; }

  .sources { font-size: 11px; color: #94a3b8; margin-top: 4px; }

  .typing { display: flex; align-items: center; gap: 4px; padding: 12px 14px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: #94a3b8; animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

  .input-area { padding: 12px 16px; border-top: 1px solid #e5e7eb; display: flex; gap: 10px; flex-shrink: 0; background: white; }
  #msg-input { flex: 1; border: 1px solid #d1d5db; border-radius: 24px; padding: 10px 16px; font-size: 14px; outline: none; transition: border 0.15s; }
  #msg-input:focus { border-color: #1a3c6e; }
  #send-btn { background: #1a3c6e; color: white; border: none; border-radius: 50%; width: 42px; height: 42px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
  #send-btn:hover { background: #2e5fa3; }
  #send-btn:disabled { background: #94a3b8; cursor: not-allowed; }

  .suggestions { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 10px; flex-shrink: 0; }
  .suggestion { font-size: 12px; border: 1px solid #d1d5db; border-radius: 16px; padding: 5px 12px; cursor: pointer; color: #475569; background: white; transition: all 0.15s; }
  .suggestion:hover { background: #1a3c6e; color: white; border-color: #1a3c6e; }
</style>
</head>
<body>

<div class="wrapper">
  <header>
    <div class="avatar">🏦</div>
    <div>
      <h1>SynthBank AI Support</h1>
      <p>Powered by RAG + GPT-3.5</p>
    </div>
    <div class="status-dot" title="Online"></div>
  </header>

  <div class="upload-bar">
    <label for="file-input">📎 Upload Document (PDF/TXT)</label>
    <input type="file" id="file-input" accept=".pdf,.txt" />
    <span id="upload-status">Default banking FAQ loaded</span>
  </div>

  <div class="messages" id="messages">
    <div class="msg bot">
      <div class="bot-avatar">🤖</div>
      <div>
        <div class="bubble">Hello! I'm SynthBank's AI assistant. I can help you with loans, credit cards, savings accounts, fixed deposits, and general banking queries. How can I help you today?</div>
      </div>
    </div>
  </div>

  <div class="suggestions" id="suggestions">
    <button class="suggestion" onclick="ask(this)">What are personal loan rates?</button>
    <button class="suggestion" onclick="ask(this)">How to apply for a credit card?</button>
    <button class="suggestion" onclick="ask(this)">What documents are needed for KYC?</button>
    <button class="suggestion" onclick="ask(this)">FD interest rates</button>
  </div>

  <div class="input-area">
    <input type="text" id="msg-input" placeholder="Ask about loans, cards, accounts..." />
    <button id="send-btn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
  const API = "http://localhost:8000";
  let sessionId = null;

  const messagesEl = document.getElementById("messages");
  const input = document.getElementById("msg-input");
  const sendBtn = document.getElementById("send-btn");

  input.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });

  function ask(btn) {
    input.value = btn.textContent;
    sendMessage();
  }

  function addMessage(role, text, sources = []) {
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    const sourcesHtml = sources.length ? `<div class="sources">📄 Sources: ${sources.join(", ")}</div>` : "";
    div.innerHTML = role === "bot"
      ? `<div class="bot-avatar">🤖</div><div><div class="bubble">${text}</div>${sourcesHtml}</div>`
      : `<div class="bubble">${text}</div>`;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement("div");
    div.className = "msg bot";
    div.id = "typing";
    div.innerHTML = `<div class="bot-avatar">🤖</div><div class="bubble typing"><span></span><span></span><span></span></div>`;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById("typing");
    if (t) t.remove();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    sendBtn.disabled = true;
    document.getElementById("suggestions").style.display = "none";

    addMessage("user", text);
    addTyping();

    try {
      const res = await fetch(`${API}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, session_id: sessionId })
      });
      const data = await res.json();
      sessionId = data.session_id;
      removeTyping();
      addMessage("bot", data.reply, data.sources);
    } catch (err) {
      removeTyping();
      addMessage("bot", "Sorry, I couldn't connect to the server. Make sure the backend is running.");
    }
    sendBtn.disabled = false;
    input.focus();
  }

  document.getElementById("file-input").addEventListener("change", async function() {
    const file = this.files[0];
    if (!file) return;
    const status = document.getElementById("upload-status");
    status.textContent = `Uploading ${file.name}...`;
    const form = new FormData();
    form.append("file", file);
    try {
      const res = await fetch(`${API}/upload`, { method: "POST", body: form });
      const data = await res.json();
      status.textContent = `✅ ${data.message} (${data.chunks} chunks)`;
      addMessage("bot", `I've ingested **${file.name}** (${data.chunks} chunks). You can now ask questions about it!`);
    } catch {
      status.textContent = "❌ Upload failed";
    }
  });
</script>
</body>
</html>
